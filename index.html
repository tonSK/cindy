<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iPhone Workout Timer & Set Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        appleDark: '#0A0A0C',
                        appleCard: '#16161A',
                        appleCardBorder: '#27272A',
                        accentBlue: '#00F0FF',
                        accentPurple: '#8B5CF6'
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0A0A0C;
            color: #F8FAFC;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .glass-panel {
            background: rgba(22, 22, 26, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-[#0A0A0C] overflow-hidden selection:bg-cyan-500 selection:text-black">

    <div class="w-full h-screen max-w-md mx-auto bg-[#0A0A0C] flex flex-col justify-between px-6 py-6 relative overflow-hidden">
        
        <!-- Top App Header -->
        <div class="flex justify-between items-center z-10 shrink-0 pt-2">
            <div>
                <span class="text-[11px] font-semibold uppercase tracking-wider text-cyan-400">Workout Session</span>
                <h1 class="text-xl font-bold tracking-tight text-white">Cindy Workout</h1>
            </div>
            <div class="flex items-center space-x-2">
                <!-- Sound Toggle & Test Button -->
                <button id="btn-sound-toggle" onclick="toggleSound()" class="px-3 py-1.5 rounded-full glass-button text-xs font-semibold text-cyan-400 hover:text-cyan-300 active:scale-95 transition flex items-center space-x-1.5 border border-cyan-500/30">
                    <i id="sound-icon" class="fa-solid fa-volume-high text-xs"></i>
                    <span id="sound-status-text">Sound ON</span>
                </button>
            </div>
        </div>

        <!-- Central Content Area -->
        <div class="flex-1 flex flex-col items-center justify-center my-auto z-10 py-2">
            
            <div class="relative w-56 h-56 sm:w-64 sm:h-64 my-2 flex items-center justify-center">
                <!-- SVG Progress Ring -->
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                    <!-- Background Track -->
                    <circle cx="50" cy="50" r="44" stroke="currentColor" stroke-width="4" class="text-white/10" fill="transparent"/>
                    <!-- Progress Arc -->
                    <circle id="timer-progress" cx="50" cy="50" r="44" stroke="currentColor" stroke-width="5" stroke-dasharray="276.46" stroke-dashoffset="0" stroke-linecap="round" class="text-cyan-400 transition-all duration-300" fill="transparent"/>
                </svg>

                <!-- Timer Inner Content -->
                <div class="absolute flex flex-col items-center justify-center text-center">
                    <span id="timer-mode-label" class="text-[10px] font-semibold tracking-widest text-cyan-400 uppercase mb-1">Countdown</span>
                    <div id="timer-display" class="text-4xl sm:text-5xl font-extrabold tracking-tighter text-white tabular-nums">20:00</div>
                    <span id="timer-subtext" class="text-[11px] text-white/50 mt-1">Target: 20 min</span>
                </div>
            </div>

            <!-- Timer Controls (Start, Pause, Reset) -->
            <div class="flex items-center space-x-3 w-full max-w-xs mt-4 mb-5">
                <button id="btn-start-pause" onclick="toggleTimer()" class="flex-1 py-4 px-6 rounded-2xl bg-gradient-to-r from-cyan-400 to-blue-500 text-black font-bold text-sm tracking-wide shadow-lg shadow-cyan-500/20 active:scale-95 transition flex items-center justify-center space-x-2">
                    <i id="start-pause-icon" class="fa-solid fa-play"></i>
                    <span id="start-pause-text">Start Timer</span>
                </button>
                <button onclick="resetAll()" class="w-14 h-14 rounded-2xl glass-button flex items-center justify-center text-white/90 hover:text-white active:scale-95 transition shadow-sm" title="Reset Timer and Sets">
                    <i class="fa-solid fa-rotate-right text-base"></i>
                </button>
            </div>

            <div class="w-full glass-panel rounded-3xl p-4.5 shadow-xl relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl pointer-events-none"></div>
                
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <span class="text-[10px] font-semibold text-white/50 uppercase tracking-wider">Round Routine</span>
                        <div class="mt-1 space-y-0.5 text-sm font-semibold text-white">
                            <div class="flex items-center space-x-2">
                                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
                                <span>5 Pull-ups</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
                                <span>10 Push-ups</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
                                <span>15 Air squats</span>
                            </div>
                        </div>
                    </div>
                    <div class="px-3 py-1 rounded-full bg-cyan-500/15 border border-cyan-500/30 text-cyan-400 text-xs font-bold shrink-0">
                        Rounds Completed: <span id="completed-sets" class="text-sm font-extrabold ml-1">0</span>
                    </div>
                </div>

                <!-- Set Progress Bar -->
                <div class="w-full h-2 bg-white/10 rounded-full overflow-hidden mb-4">
                    <div id="set-progress-bar" class="h-full bg-gradient-to-r from-cyan-400 to-blue-500 w-[0%] transition-all duration-300"></div>
                </div>

                <!-- Set Action Buttons -->
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="decrementSet()" class="py-3 rounded-xl glass-button text-xs font-semibold text-white/80 hover:text-white active:scale-95 transition flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-minus text-[10px]"></i>
                        <span>Subtract Round</span>
                    </button>
                    <button onclick="incrementSet()" class="py-3 rounded-xl bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-500/40 text-xs font-semibold text-cyan-300 active:scale-95 transition flex items-center justify-center space-x-1.5 shadow-md">
                        <i class="fa-solid fa-plus text-[10px]"></i>
                        <span>+1 Round Completed</span>
                    </button>
                </div>
            </div>

        </div>

    </div>

    <script>
        const INITIAL_TIME = 20 * 60; // 20 minutes countdown in seconds
        let remainingSeconds = INITIAL_TIME;
        let timerInterval = null;
        let isRunning = false;
        let soundEnabled = true;

        let completedSets = 0;
        const TARGET_SETS_GOAL = 20;

        const timerDisplay = document.getElementById('timer-display');
        const startPauseText = document.getElementById('start-pause-text');
        const startPauseIcon = document.getElementById('start-pause-icon');
        const timerProgress = document.getElementById('timer-progress');

        // Web Audio API Context for generating sound without external files
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Generate audio beep signal
        function playBeep(frequency = 880, duration = 0.2, count = 1, interval = 0.3) {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;

            for (let i = 0; i < count; i++) {
                const startTime = ctx.currentTime + (i * interval);
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(frequency, startTime);

                gain.gain.setValueAtTime(0.3, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(startTime);
                osc.stop(startTime + duration);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const statusText = document.getElementById('sound-status-text');
            const icon = document.getElementById('sound-icon');
            
            if (soundEnabled) {
                statusText.innerText = 'Sound ON';
                icon.className = 'fa-solid fa-volume-high text-xs';
                // Play test beep to verify audio output works on device
                playBeep(880, 0.15, 1);
            } else {
                statusText.innerText = 'Sound OFF';
                icon.className = 'fa-solid fa-volume-xmark text-xs';
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateDisplay() {
            timerDisplay.innerText = formatTime(remainingSeconds);
            const circumference = 276.46;
            const offset = circumference - (remainingSeconds / INITIAL_TIME) * circumference;
            timerProgress.style.strokeDashoffset = offset;
        }

        function toggleTimer() {
            getAudioContext(); // Resume web audio context on user interaction
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (remainingSeconds <= 0) return;
            isRunning = true;
            startPauseText.innerText = 'Pause';
            startPauseIcon.className = 'fa-solid fa-pause';

            timerInterval = setInterval(() => {
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    updateDisplay();
                } else {
                    clearInterval(timerInterval);
                    isRunning = false;
                    startPauseText.innerText = 'Start Timer';
                    startPauseIcon.className = 'fa-solid fa-play';
                    
                    // Trigger alarm sound and vibration when timer finishes
                    playBeep(880, 0.4, 4, 0.5); // 4 consecutive loud beeps
                    triggerVibration();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            startPauseText.innerText = 'Resume';
            startPauseIcon.className = 'fa-solid fa-play';
        }

        function resetAll() {
            pauseTimer();
            remainingSeconds = INITIAL_TIME;
            updateDisplay();
            startPauseText.innerText = 'Start Timer';
            startPauseIcon.className = 'fa-solid fa-play';

            // Clear sets counter
            completedSets = 0;
            updateSetUI();
        }

        function incrementSet() {
            getAudioContext();
            completedSets++;
            updateSetUI();
            playBeep(1200, 0.08, 1); // Subtle feedback click sound
        }

        function decrementSet() {
            getAudioContext();
            if (completedSets > 0) {
                completedSets--;
                updateSetUI();
            }
        }

        function updateSetUI() {
            document.getElementById('completed-sets').innerText = completedSets;
            const percentage = Math.min((completedSets / TARGET_SETS_GOAL) * 100, 100);
            document.getElementById('set-progress-bar').style.width = `${percentage}%`;
        }

        function triggerVibration() {
            if (navigator.vibrate) {
                navigator.vibrate([300, 150, 300, 150, 400]);
            }
        }

        // Initial render
        updateDisplay();
        updateSetUI();
    </script>
</body>
</html>
