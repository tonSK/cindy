<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cindy Workout Timer</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-blue: #0A84FF;
            --accent-green: #30D158;
            --accent-red: #FF453A;
            --text-main: #FFFFFF;
            --text-sub: #8E8E93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(16px, 4vh, 24px) 20px clamp(20px, 5vh, 32px);
            overflow: hidden;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: env(safe-area-inset-top, 10px);
        }

        .title-group h1 {
            font-size: clamp(22px, 3.2vw, 26px);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .sound-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .sound-btn:active {
            transform: scale(0.92);
        }

        /* Main Container */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(16px, 3vh, 28px);
            flex: 1;
        }

        /* Timer Display */
        .timer-container {
            position: relative;
            width: clamp(220px, 60vw, 280px);
            height: clamp(220px, 60vw, 280px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .progress-ring__circle-bg {
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 10;
            fill: transparent;
        }

        .progress-ring__circle {
            stroke: var(--accent-blue);
            stroke-width: 10;
            stroke-linecap: round;
            fill: transparent;
            transition: stroke-dashoffset 0.5s ease;
        }

        .timer-text-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .timer-display {
            font-size: clamp(48px, 13vw, 64px);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1.5px;
            line-height: 1;
        }

        .timer-status {
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 500;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Exercise Info Box */
        .exercise-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px 20px;
            width: 100%;
            max-width: 360px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .exercise-card h3 {
            font-size: 12px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
        }

        .exercise-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .exercise-item {
            font-size: clamp(15px, 2.2vw, 17px);
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
        }

        .exercise-item::before {
            content: "•";
            color: var(--accent-blue);
            font-size: 20px;
            margin-right: 10px;
            line-height: 0;
        }

        /* Set Tracker & Controls */
        .set-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px 20px;
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .set-info {
            display: flex;
            flex-direction: column;
        }

        .set-label {
            font-size: 12px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .set-count {
            font-size: clamp(28px, 7vw, 36px);
            font-weight: 800;
            color: var(--accent-blue);
            line-height: 1.1;
        }

        .add-set-btn {
            background: var(--accent-blue);
            color: #FFFFFF;
            border: none
